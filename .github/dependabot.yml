# To get started with Dependabot version updates, you'll need to specify which
# package ecosystems to update and where the package manifests are located.
# Please see the documentation for all configuration options:
# https://docs.github.com/github/administering-a-repository/configuration-options-for-dependency-updates

version: 2
enable-beta-ecosystems: true
updates:
  - package-ecosystem: "pub"
    directory: "/"
    schedule:
      interval: "daily"
    assignees:
      - "Coho04"
    reviewers:
      - "Coho04"
    labels:
      - "dependencies"
    groups:
      # Die FlutterFire-Plugins pinnen das firebase-ios-sdk exakt und erscheinen
      # im Gleichschritt. Einzeln angehoben widersprechen sie sich, und die
      # Aufloesung der Swift-Pakete schlaegt fehl. Deshalb ein PR fuer alle.
      firebase:
        patterns:
          - "firebase_*"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "daily"
    assignees:
      - "Coho04"
    reviewers:
      - "Coho04"
    labels:
      - "dependencies"

  - package-ecosystem: "gradle"
    directory: "/android"
    schedule:
      interval: "daily"
    assignees:
      - "Coho04"
    reviewers:
      - "Coho04"
    labels:
      - "dependencies"

  - package-ecosystem: "bundler"
    directory: "/ios"
    schedule:
      interval: "daily"
    assignees:
      - "Coho04"
    reviewers:
      - "Coho04"
    labels:
      - "dependencies"